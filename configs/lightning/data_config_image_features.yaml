# Data source
  h5_path: /myhome/iris/data/fucci_3t3_221124_filtered_noNG030JP208_with_nuclei_seg.h5

  # DataLoader settings
  batch_size: 64
  num_workers: 16 # Use 0 for A100 to avoid shared memory issues
  persistent_workers: true
  pin_memory: false

  # Train/val split
  data_split: [0.7, 0.2, 0.1]  # Train, Val, Test splits
  seed: 42

  add_features: true
  # Quality filters
  use_quality_filters: true
  plane_count: 3
  max_objects: 1
  min_seg_pixels: 10
  max_nuclei_outside_ratio: 0.2
  force_refilter: false  # Use cached results if available

  concat_features: true

  fucci_transform:
    log: {}
  # Preprocessing transforms
  image_transform_config:
    - class_path: src.data_pipeline.data_transforms.NormalizeTransform
      init_args:
        method: standardize  # Changed to standardize for zero mean and unit variance
        channel_keys: ['405', 'bf']

  feature_transform_config:
   - class_path: sklearn.preprocessing.StandardScaler
     init_args: {}

  augmentations:
      RandomHorizontalFlip:
        p: 0.5
      RandomVerticalFlip:
        p: 0.5
      RandomRotation:
        degrees: 360
      GaussianBlur:
        sigma: [0.01, 0.5]
        kernel_size: [5,5]
      RandomErasing:
        p: 0.3
        scale: [0.01, 0.2]
        ratio: [0.5, 2.0]
