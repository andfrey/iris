# Configuration for Lightning CLI with Modular Architecture
# Usage: python src/train_model.py fit --config configs/train_cnet_modular.yaml

# Seed for reproducibility
seed_everything: 42

project_name: cnet_cell_cycle
experiment_name: cnet_experiment_polygon_projection
# Trainer configuration
trainer:
  default_root_dir: checkpoints/cnet/
  max_epochs: 150
  accelerator: auto
  devices: 1
  #gradient_clip_val: 1.0
  # overfit_batches: 0.018
  log_every_n_steps: 10
  enable_checkpointing: true
  profiler: simple
  callbacks:
    - class_path: src.train.callbacks.DebugCallback
      init_args: {}
    - class_path: src.train.callbacks.EvaluationCallback
      init_args: {}
    - class_path: lightning.pytorch.callbacks.ModelSummary
      init_args:
        max_depth: -1  # Show all layers (default is 1)
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 3
        filename: 'epoch{epoch:02d}-val_loss{val_loss:.4f}'
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 30
        mode: min
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

# Model configuration
model:
  model: CNet
  init_args:
    in_channels: 2  # 2 channels × 3 planes = 6 total channels after stacking
    #feature_dim: 19
    output_dim: 1
    num_blocks: 5
    dropout: 0.3
    use_batchnorm: true
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.001
    scheduler: plateau
    fc_hidden_dims: [256, 128]

data:
  data_config_path: "/myhome/iris/configs/lightning/data_config_augmentation.yaml"
