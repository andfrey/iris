
  # DataLoader settings
  batch_size: 64
  num_workers: 0

  # Train/val split
  data_split: [0.7, 0.2, 0.1]  # Train, Val, Test splits
  seed: 42

  # Data source
  data_source:
    h5_path: /myhome/iris/data/fucci_3t3_221124_filtered_noNG030JP208_with_nuclei_seg.h5
    # Quality filters
    quality_filters:
      plane_count: 3
      max_objects: 1
      min_seg_pixels: 10
      max_nuclei_outside_ratio: 0.2
      force_refilter: false  # Use cached results if available

  # dataset
  fucci_transform:
    log: {}
  # Preprocessing transforms
  image_transforms:
    - class_path: src.data_pipeline.data_transforms.SelectPlanesTransform
      init_args:
        plane_selection: 'middle'
    - class_path: src.data_pipeline.data_transforms.NormalizeTransform
      init_args:
        method: standardize  # Changed to standardize for zero mean and unit variance
        channel_keys: ['bf', '405']
    - class_path: src.data_pipeline.data_transforms.RemoveBackgroundTransform
      init_args: {}

  augmentations:
    RandomHorizontalFlip:
      p: 0.5
    RandomVerticalFlip:
      p: 0.5
    RandomRotation:
      degrees: 360
    GaussianBlur:
      sigma: [0.01, 0.5]
      kernel_size: [5,5]
    RandomErasing:
      p: 0.3
      scale: [0.01, 0.2]
      ratio: [0.5, 2.0]

  fucci_1D_projection: true
  projection_shape: "polygon"
